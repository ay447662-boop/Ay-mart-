<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Cart</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#131921;
color:#fff;
padding:15px;
font-size:25px;
text-align:center;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.item{
display:flex;
align-items:center;
justify-content:space-between;
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.item img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
}

.info{
flex:1;
margin-left:15px;
}

.price{
font-size:20px;
color:#ff6600;
font-weight:bold;
}

button{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

.total{
background:white;
padding:20px;
border-radius:10px;
font-size:22px;
font-weight:bold;
margin-top:20px;
text-align:right;
}

.checkout{
width:100%;
padding:15px;
background:#ff9900;
color:white;
font-size:20px;
border:none;
border-radius:8px;
margin-top:15px;
}
</style>

</head>

<body>

<header>
🛒 My Cart
</header>

<div class="container">

<div id="cartItems"></div>

<div class="total">
Total ₹ <span id="total">0</span>
</div>

<button class="checkout">
Proceed To Checkout
</button>

</div>

<script>

let cartItems=document.getElementById("cartItems");
