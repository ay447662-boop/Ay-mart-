<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Wishlist</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#131921;
color:#fff;
padding:15px;
text-align:center;
font-size:26px;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.item{
display:flex;
align-items:center;
justify-content:space-between;
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.item img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
}

.info{
flex:1;
margin-left:15px;
}

.price{
font-size:20px;
font-weight:bold;
color:#ff6600;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin-left:10px;
}

.cartBtn{
background:#ff9900;
color:#fff;
}

.deleteBtn{
background:#e53935;
color:#fff;
}

.empty{
text-align:center;
font-size:22px;
margin-top:60px;
color:#666;
}
</style>

</head>

<body>

<header>❤️ My Wishlist</header>

<div class="container">

<div id="wishlistItems"></div>

</div>

<script>

let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let box=document.getElementById("wishlistItems");

function loadWishlist(){

box.innerHTML="";

if(wishlist.length==0){

box.innerHTML='<div class="empty">Wishlist Empty ❤️</div>';

return;

}

wishlist.forEach((item,index)=>{

box.innerHTML+=`

<div class="item">

<img src="${item.image}">

<div class="info">

<h3>${item.name}</h3>

<div class="price">₹${item.price}</div>

</div>

<button class="cartBtn"

onclick="moveCart(${index})">

Add To Cart

</button>

<button class="deleteBtn"

onclick="removeWish(${index})">

Delete

</button>

</div>

`;

});

}

function moveCart(index){

cart.push(wishlist[index]);

localStorage.setItem("cart",JSON.stringify(cart));

alert("Added to Cart");

}

function removeWish(index){

wishlist.splice(index,1);

localStorage.setItem("wishlist",JSON.stringify(wishlist));

loadWishlist();

}

loadWishlist();

</script>

</body>
</html>
