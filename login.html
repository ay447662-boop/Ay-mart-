<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Login</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:350px;
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:30px;
margin-bottom:20px;
color:#ff6a00;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#ff6a00;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e55b00;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#ff6a00;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🛒 AyMart
</div>

<h2 align="center">Login</h2>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<p>
Don't have an account?
<a href="signup.html">Signup</a>
</p>

</div>

<script>
function login(){

let email=document.getElementById("email").value;

let password=document.getElementById("password").value;

if(email==""||password==""){

alert("Please fill all fields");

return;

}

localStorage.setItem("user",email);

alert("Login Successful");

window.location.href="index.html";

}
</script>

</body>
</html>
