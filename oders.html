<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart - My Orders</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#131921;
color:#fff;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.order{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.status{
padding:6px 12px;
border-radius:20px;
background:#4CAF50;
color:#fff;
font-size:14px;
}

.empty{
text-align:center;
margin-top:80px;
font-size:22px;
color:#666;
}

.homeBtn{
display:block;
margin:20px auto;
width:220px;
padding:14px;
background:#ff9900;
color:#fff;
text-align:center;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<body>

<header>
📦 My Orders
</header>

<div class="container">

<div id="orders"></div>

<a href="index.html" class="homeBtn">
Continue Shopping
</a>

</div>

<script>

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let box = document.getElementById("orders");

function loadOrders(){

if(orders.length==0){

box.innerHTML='<div class="empty">No Orders Found 📦</div>';

return;

}

box.innerHTML="";

orders.forEach((item)=>{

box.innerHTML += `

<div class="order">

<div>

<h3>${item.name}</h3>

<p>₹ ${item.price}</p>

</div>

<div class="status">

Delivered

</div>

</div>

`;

});

}

loadOrders();

</script>

</body>
</html>
