<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Payment</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#131921;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:650px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
margin-bottom:15px;
}

.option{
border:1px solid #ddd;
border-radius:8px;
padding:15px;
margin:10px 0;
cursor:pointer;
}

.option:hover{
background:#f9f9f9;
}

input[type=radio]{
margin-right:10px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#ff9900;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e68a00;
}
</style>

</head>

<body>

<header>
💳 Payment
</header>

<div class="container">

<h2>Select Payment Method</h2>

<label class="option">
<input type="radio" name="pay" value="COD" checked>
Cash on Delivery
</label>

<label class="option">
<input type="radio" name="pay" value="UPI">
UPI Payment
</label>

<label class="option">
<input type="radio" name="pay" value="Card">
Debit / Credit Card
</label>

<label class="option">
<input type="radio" name="pay" value="NetBanking">
Net Banking
</label>

<button onclick="payNow()">
Proceed Payment
</button>

</div>

<script>

function payNow(){

let method=document.querySelector(
'input[name="pay"]:checked'
).value;

localStorage.setItem("paymentMethod",method);

alert("Payment Method Selected: "+method);

window.location.href="orders.html";

}

</script>

</body>
</html>
