<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#131921;
color:#fff;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:20px auto;
padding:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
color:#ff9900;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
}

.panel{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:12px 20px;
background:#ff9900;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

table th,table td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

table th{
background:#131921;
color:#fff;
}
</style>
</head>

<body>

<header>
🛠 AyMart Admin Panel
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>Total Users</h2>
<p id="users">0</p>
</div>

<div class="card">
<h2>Total Orders</h2>
<p id="orders">0</p>
</div>

<div class="card">
<h2>Total Products</h2>
<p id="products">0</p>
</div>

</div>

<div class="panel">

<h2>Add Product</h2>

<input id="pname" placeholder="Product Name">

<input id="pprice" placeholder="Price">

<input id="pimage" placeholder="Image URL">

<button onclick="addProduct()">
Add Product
</button>

<table>

<tr>
<th>Name</th>
<th>Price</th>
<th>Image</th>
</tr>

<tbody id="list"></tbody>

</table>

</div>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const ADMIN_UID = "VU5OLEWIFhYYFdTxqbMLMRLVl1s1";

let products = {};

const list = document.getElementById("list");
const productCount = document.getElementById("products");
const userCount = document.getElementById("users");
const orderCount = document.getElementById("orders");

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function loadProducts() {
  onValue(ref(db, "products"), (snapshot) => {
    products = snapshot.val() || {};
    const items = Object.entries(products);

    productCount.innerText = items.length;
    list.innerHTML = "";

    if (!items.length) {
      list.innerHTML = '<tr><td colspan="3">No products yet</td></tr>';
      return;
    }

    items.forEach(([id, p]) => {
      list.innerHTML += `
        <tr>
          <td>${escapeHtml(p.name)}</td>
          <td>₹${escapeHtml(p.price)}</td>
          <td>${p.image ? `<img src="${escapeHtml(p.image)}" alt="" style="width:60px;height:60px;object-fit:contain;">` : "—"}</td>
        </tr>
      `;
    });
  }, (error) => {
    console.error(error);
    alert("Products load नहीं हुए: " + error.message);
  });
}

function addProduct() {
  const name = document.getElementById("pname").value.trim();
  const price = document.getElementById("pprice").value.trim();
  const image = document.getElementById("pimage").value.trim();

  if (!name || !price) {
    alert("Product Name और Price भरें");
    return;
  }

  push(ref(db, "products"), {
    name,
    price,
    image,
    createdAt: Date.now(),
    active: true
  })
    .then(() => {
      document.getElementById("pname").value = "";
      document.getElementById("pprice").value = "";
      document.getElementById("pimage").value = "";
      alert("Product Firebase में successfully add हो गया ✅");
    })
    .catch((error) => {
      console.error(error);
      alert("Product add नहीं हुआ: " + error.message);
    });
}

window.addProduct = addProduct;

onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("Admin Panel इस्तेमाल करने के लिए पहले AyMart में login करें।");
    userCount.innerText = "0";
    return;
  }

  if (user.uid !== ADMIN_UID) {
    alert("Access denied: यह account Admin नहीं है।");
    document.querySelector("button").disabled = true;
    return;
  }

  userCount.innerText = "1";
  loadProducts();

  // Orders अभी पुराने localStorage flow में हैं।
  // अगला चरण Firebase Orders पर shift करेगा।
  const oldOrders = JSON.parse(localStorage.getItem("orders")) || [];
  orderCount.innerText = oldOrders.length;
});
</script>

</body>
</html>
