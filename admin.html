<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#131921;
color:#fff;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:20px auto;
padding:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
color:#ff9900;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
}

.panel{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:12px 20px;
background:#ff9900;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

table th,table td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

table th{
background:#131921;
color:#fff;
}
</style>
</head>

<body>

<header>
🛠 AyMart Admin Panel
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>Total Users</h2>
<p id="users">0</p>
</div>

<div class="card">
<h2>Total Orders</h2>
<p id="orders">0</p>
</div>

<div class="card">
<h2>Total Products</h2>
<p id="products">0</p>
</div>

</div>

<div class="panel">

<h2>Add Product</h2>

<input id="pname" placeholder="Product Name">

<input id="pprice" placeholder="Price">

<input id="pimage" placeholder="Image URL">

<button onclick="addProduct()">
Add Product
</button>

<table>

<tr>
<th>Name</th>
<th>Price</th>
<th>Image</th>
</tr>

<tbody id="list"></tbody>

</table>

</div>

</div>

<script>

let products=
JSON.parse(localStorage.getItem("products"))||[];

function load(){

document.getElementById("products").innerText=products.length;

document.getElementById("users").innerText=
localStorage.getItem("userEmail")?1:0;

let orders=
JSON.parse(localStorage.getItem("orders"))||[];

document.getElementById("orders").innerText=
orders.length;

let list=document.getElementById("list");

list.innerHTML="";

products.forEach(p=>{

list.innerHTML+=`
<tr>
<td>${p.name}</td>
<td>₹${p.price}</td>
<td>${p.image}</td>
</tr>
`;

});

}

function addProduct(){

let name=document.getElementById("pname").value;

let price=document.getElementById("pprice").value;

let image=document.getElementById("pimage").value;

if(name==""||price==""){

alert("Fill all fields");

return;

}

products.push({

name:name,

price:price,

image:image

});

localStorage.setItem(
"products",
JSON.stringify(products)
);

alert("Product Added");

load();

}

load();

</script>

</body>
</html>
