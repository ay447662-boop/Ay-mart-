<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart - Shop Smart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">
<i class="fa-solid fa-cart-shopping"></i>
<span>AyMart</span>
</div>

<div class="search">

<input type="text"
placeholder="Search Products...">

<button>
<i class="fa fa-search"></i>
</button>

</div>

<div class="icons">

<i class="fa-regular fa-heart"></i>

<i class="fa-solid fa-cart-shopping"></i>

<i class="fa-regular fa-user"></i>

</div>

</header>

<section class="banner">

<h1>Welcome To AyMart</h1>

<p>India's Smart Shopping Platform</p>

<button>Shop Now</button>

</section>

<section class="category">

<h2>Categories</h2>

<div class="grid">

<div class="box">
👕
<p>Fashion</p>
</div>

<div class="box">
📱
<p>Mobiles</p>
</div>

<div class="box">
💻
<p>Electronics</p>
</div>

<div class="box">
🍎
<p>Grocery</p>
</div>

<div class="box">
💄
<p>Beauty</p>
</div>

<div class="box">
🏠
<p>Home</p>
</div>

</div>
<section class="slider">

<div class="slides fade">
<img src="assets/images/banner1.jpg" alt="Banner 1">
</div>

<div class="slides fade">
<img src="assets/images/banner2.jpg" alt="Banner 2">
</div>

<div class="slides fade">
<img src="assets/images/banner3.jpg" alt="Banner 3">
</div>

</section>
</section>
<section class="products">

<h2>🔥 Flash Sale</h2>

<div class="product-grid">

<div class="product">
<img src="assets/images/shirt.png" alt="Shirt">
<h3>Men T-Shirt</h3>
<p class="price">₹499 <del>₹999</del></p>
<button>Add To Cart</button>
</div>

<div class="product">
<img src="assets/images/shoes.png" alt="Shoes">
<h3>Running Shoes</h3>
<p class="price">₹999 <del>₹1999</del></p>
<button>Add To Cart</button>
</div>

<div class="product">
<img src="assets/images/watch.png" alt="Watch">
<h3>Smart Watch</h3>
<p class="price">₹1499 <del>₹2999</del></p>
<button>Add To Cart</button>
</div>

<div class="product">
<img src="assets/images/headphone.png" alt="Headphone">
<h3>Headphone</h3>
<p class="price">₹799 <del>₹1499</del></p>
<button>Add To Cart</button>
</div>

</div>

</section>
<nav class="bottom">

<div>
<i class="fa fa-house"></i>
<p>Home</p>
</div>

<div>
<i class="fa fa-list"></i>
<p>Category</p>
</div>

<div>
<i class="fa fa-cart-shopping"></i>
<p>Cart</p>
</div>

<div>
<i class="fa fa-user"></i>
<p>Profile</p>
</div>

</nav>

<script src="script.js"></script>

</body>
</html>
