<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart - Shop Smart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">
<i class="fa-solid fa-cart-shopping"></i>
<span>AyMart</span>
</div>

<div class="search">

<input type="text"
placeholder="Search Products...">

<button id="searchBtn" type="button" aria-label="Search"><i class="fa fa-search"></i></button>

</div>

<div class="icons">

<i id="wishlistBtn" class="fa-regular fa-heart" role="button" title="Wishlist"></i>

<i id="cartBtn" class="fa-solid fa-cart-shopping" role="button" title="Cart"></i>

<i id="profileBtn" class="fa-regular fa-user" role="button" title="Profile"></i>

</div>

</header>

<section class="banner">

<h1>Welcome To AyMart</h1>

<p>India's Smart Shopping Platform</p>

<button id="shopNow" type="button">Shop Now</button>

</section>

<section class="category">

<h2>Categories</h2>

<div class="grid">

<div class="box">
👕
<p>Fashion</p>
</div>

<div class="box">
📱
<p>Mobiles</p>
</div>

<div class="box">
💻
<p>Electronics</p>
</div>

<div class="box">
🍎
<p>Grocery</p>
</div>

<div class="box">
💄
<p>Beauty</p>
</div>

<div class="box">
🏠
<p>Home</p>
</div>

</div>
<section class="slider">

<div class="slides fade">
<img src="assets/images/banner1.jpg" alt="Banner 1">
</div>

<div class="slides fade">
<img src="assets/images/banner2.jpg" alt="Banner 2">
</div>

<div class="slides fade">
<img src="assets/images/banner3.jpg" alt="Banner 3">
</div>

</section>
</section>
<section class="products" id="products-section">
<h2>🔥 Flash Sale</h2>
<div class="product-grid" id="productGrid">
  <p id="productStatus">Products load हो रहे हैं...</p>
</div>
</section>
<nav class="bottom">
<div id="homeNav" role="button">
<i class="fa fa-house"></i>
<p>Home</p>
</div>
<div id="categoryNav" role="button">
<i class="fa fa-list"></i>
<p>Category</p>
</div>
<div id="cartNav" role="button">
<i class="fa fa-cart-shopping"></i>
<p>Cart <span id="cartCount">0</span></p>
</div>
<div id="profileNav" role="button">
<i class="fa fa-user"></i>
<p>Profile</p>
</div>
</nav>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const grid = document.getElementById("productGrid");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const cartCountEl = document.getElementById("cartCount");

let allProducts = [];
let searchTerm = "";

const demoProducts = [
  { id: "demo-shirt", name: "Men T-Shirt", price: 499, oldPrice: 999, image: "assets/images/shirt.png" },
  { id: "demo-shoes", name: "Running Shoes", price: 999, oldPrice: 1999, image: "assets/images/shoes.png" },
  { id: "demo-watch", name: "Smart Watch", price: 1499, oldPrice: 2999, image: "assets/images/watch.png" },
  { id: "demo-headphone", name: "Headphone", price: 799, oldPrice: 1499, image: "assets/images/headphone.png" }
];

function getCart() {
  try {
    return JSON.parse(localStorage.getItem("aymart_cart") || "[]");
  } catch {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem("aymart_cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount() {
  const count = getCart().reduce((sum, item) => sum + Number(item.qty || 1), 0);
  cartCountEl.textContent = count;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizeProduct(id, p) {
  return {
    id,
    name: p?.name || "Unnamed Product",
    price: Number(p?.price || 0),
    oldPrice: Number(p?.oldPrice || p?.mrp || 0),
    image: p?.image || "assets/images/shirt.png",
    category: String(p?.category || "All")
  };
}

function renderProducts(list) {
  if (!list.length) {
    grid.innerHTML = '<p id="productStatus">कोई product नहीं मिला।</p>';
    return;
  }

  grid.innerHTML = list.map(p => `
    <div class="product" data-id="${escapeHtml(p.id)}">
      <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}"
           onerror="this.src='assets/images/shirt.png'">
      <h3>${escapeHtml(p.name)}</h3>
      <p class="price">₹${p.price.toLocaleString("en-IN")}
        ${p.oldPrice ? `<del>₹${p.oldPrice.toLocaleString("en-IN")}</del>` : ""}
      </p>
      <button type="button" class="add-cart" data-id="${escapeHtml(p.id)}">
        Add To Cart
      </button>
    </div>
  `).join("");

  grid.querySelectorAll(".add-cart").forEach(btn => {
    btn.addEventListener("click", () => addToCart(btn.dataset.id));
  });

  grid.querySelectorAll(".product img, .product h3").forEach(el => {
    el.addEventListener("click", () => {
      const card = el.closest(".product");
      openProduct(card.dataset.id);
    });
  });
}

function filteredProducts() {
  const q = searchTerm.trim().toLowerCase();
  if (!q) return allProducts;
  return allProducts.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.category.toLowerCase().includes(q)
  );
}

function addToCart(id) {
  const product = allProducts.find(p => p.id === id);
  if (!product) return;

  const cart = getCart();
  const existing = cart.find(item => item.id === id);

  if (existing) {
    existing.qty = Number(existing.qty || 1) + 1;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      image: product.image,
      qty: 1
    });
  }

  saveCart(cart);
  alert(product.name + " cart में add हो गया ✅");
}

function openProduct(id) {
  const product = allProducts.find(p => p.id === id);
  if (!product) return;
  sessionStorage.setItem("aymart_selected_product", JSON.stringify(product));
  window.location.href = "product.html";
}

function goCart() {
  window.location.href = "cart.html";
}

function goProfile() {
  window.location.href = "profile.html";
}

function goHome() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function search() {
  searchTerm = searchInput.value;
  renderProducts(filteredProducts());
  document.getElementById("products-section").scrollIntoView({ behavior: "smooth" });
}

searchBtn.addEventListener("click", search);
searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});
searchInput.addEventListener("input", () => {
  searchTerm = searchInput.value;
  renderProducts(filteredProducts());
});

document.getElementById("shopNow").addEventListener("click", () => {
  document.getElementById("products-section").scrollIntoView({ behavior: "smooth" });
});
document.getElementById("cartBtn").addEventListener("click", goCart);
document.getElementById("cartNav").addEventListener("click", goCart);
document.getElementById("profileBtn").addEventListener("click", goProfile);
document.getElementById("profileNav").addEventListener("click", goProfile);
document.getElementById("homeNav").addEventListener("click", goHome);

document.getElementById("categoryNav").addEventListener("click", () => {
  document.querySelector(".category").scrollIntoView({ behavior: "smooth" });
});

document.querySelectorAll(".category .box").forEach(box => {
  box.addEventListener("click", () => {
    const category = box.querySelector("p")?.textContent?.trim() || "";
    searchInput.value = category;
    searchTerm = category;
    renderProducts(filteredProducts());
    document.getElementById("products-section").scrollIntoView({ behavior: "smooth" });
  });
});

document.getElementById("wishlistBtn").addEventListener("click", () => {
  window.location.href = "wishlist.html";
});

updateCartCount();

/* Firebase: real products from Admin Panel */
onValue(ref(db, "products"), snapshot => {
  const data = snapshot.val() || {};
  const firebaseProducts = Object.entries(data)
    .filter(([, p]) => p && p.active !== false)
    .map(([id, p]) => normalizeProduct(id, p));

  // Keep the demo cards visible until the first real product is added.
  // Once Firebase has products, only Firebase products are shown.
  allProducts = firebaseProducts.length ? firebaseProducts : demoProducts;

  renderProducts(filteredProducts());
}, error => {
  console.error("Firebase products error:", error);
  allProducts = demoProducts;
  renderProducts(filteredProducts());
});

/* Auth state is intentionally only observed here; login remains on login.html. */
onAuthStateChanged(auth, user => {
  if (user) {
    console.log("AyMart logged in:", user.uid);
  }
});
</script>
</body>
</html>
