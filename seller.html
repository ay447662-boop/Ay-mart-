<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyMart Seller Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#131921;
color:#fff;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:20px auto;
padding:15px;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#ff9900;
color:#fff;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e68a00;
}

.product{
display:flex;
justify-content:space-between;
align-items:center;
background:#fafafa;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ddd;
}

.delete{
background:#e53935;
padding:8px 12px;
border:none;
color:#fff;
border-radius:5px;
cursor:pointer;
width:auto;
}
</style>
</head>

<body>

<header>
🏪 AyMart Seller Panel
</header>

<div class="container">

<div class="box">

<h2>Add New Product</h2>

<input id="name" placeholder="Product Name">

<input id="price" type="number" placeholder="Price">

<input id="image" placeholder="Image URL">

<textarea id="desc" placeholder="Product Description"></textarea>

<button onclick="addProduct()">
Add Product
</button>

</div>

<div class="box" style="margin-top:20px;">

<h2>My Products</h2>

<div id="list"></div>

</div>

</div>

<script>

let products=JSON.parse(localStorage.getItem("products"))||[];

function save(){

localStorage.setItem("products",JSON.stringify(products));

}

function show(){

let list=document.getElementById("list");

list.innerHTML="";

products.forEach((p,index)=>{

list.innerHTML+=`

<div class="product">

<div>

<h3>${p.name}</h3>

<p>₹ ${p.price}</p>

<small>${p.desc}</small>

</div>

<button class="delete"

onclick="removeProduct(${index})">

Delete

</button>

</div>

`;

});

}

function addProduct(){

let name=document.getElementById("name").value;

let price=document.getElementById("price").value;

let image=document.getElementById("image").value;

let desc=document.getElementById("desc").value;

if(name==""||price==""){

alert("Please fill required fields");

return;

}

products.push({

name:name,

price:price,

image:image,

desc:desc

});

save();

show();

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
document.getElementById("desc").value="";

alert("Product Added Successfully");

}
